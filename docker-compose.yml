services:
  db:
    image: postgres:15
    container_name: os_db
    restart: always
    environment:
      POSTGRES_DB: os_manager_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rA9
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Carrega o schema + seeds (schemas, tabelas, metadata e admin padrao) apenas
      # quando o volume esta vazio (primeiro `up` de um clone limpo). Em ambientes
      # que ja tem dados no volume, o Postgres ignora este script.
      - ./backend/estrutura_banco.sql:/docker-entrypoint-initdb.d/01-estrutura.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d os_manager_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: os_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: os_manager_db
      DB_USERNAME: postgres
      DB_PASSWORD: rA9

  front:
    build:
      context: ./frontend
    container_name: os_front
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # node_modules e .next ficam em volumes nomeados (filesystem nativo do
      # container), não no bind mount. Resolução de módulos e cache do Turbopack
      # fazem I/O intenso; atravessar o bind mount deixava cada compilação de
      # rota nova (10-20s+) e travava a tela ao trocar de página. Isso também
      # "esconde" o node_modules do host, então installs de pacote precisam
      # rodar dentro do container (`docker compose exec front npm install ...`).
      - front_node_modules:/app/node_modules
      - front_next_cache:/app/.next
    environment:
      # O bind mount do Docker no Linux não propaga eventos inotify para dentro
      # do container, então o watcher do Next não percebia rotas novas/alteradas
      # (dava 404-fantasma até reiniciar). Polling faz o watcher varrer o disco.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api

volumes:
  postgres_data:
  front_node_modules:
  front_next_cache:
